name: Publicar no Cloudflare

# Publica a cada push na main. Também dá para disparar à mão pela aba Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Uma publicação por vez: se dois pushes chegarem juntos, o segundo espera em
# vez de correr em paralelo e sobrescrever fora de ordem.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Antes do build, porque o build nao confere tipo nenhum: o vite usa
      # esbuild, que apaga os tipos sem olhar. Foi assim que um "Cannot find
      # name" chegou em producao e derrubou o Quadro Geral.
      - name: Conferir tipos
        run: npm run typecheck

      # O typecheck nao enxerga os arquivos com @ts-nocheck, que e justamente
      # onde os dois "Cannot find name" que quebraram producao se esconderam.
      # Este confere so essa classe, e confere em todo mundo.
      - name: Conferir nomes indefinidos
        run: npm run nomes

      - name: Build
        run: npm run build
        env:
          # O Vite injeta estas na hora do build; sem elas o app sobe sem
          # conseguir falar com o Supabase.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Publicar
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Publica a saida do build, nao o codigo-fonte. Ver wrangler.deploy.jsonc.
          command: deploy --config wrangler.deploy.jsonc
